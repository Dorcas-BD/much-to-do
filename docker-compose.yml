version: "3.3"

services:
  mongodb:
    image: mongo:7
    container_name: much-todo-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: much_todo_db
    volumes:
      - mongodb_data:/data/db

  backend:
    build: .
    container_name: much-todo-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      MONGO_URI: mongodb://admin:password@mongodb:27017/much_todo_db?authSource=admin
      DB_NAME: much_todo_db
      JWT_SECRET_KEY: your-super-secret-key-that-is-long-and-random
      JWT_EXPIRATION_HOURS: 72
      LOG_LEVEL: DEBUG
      LOG_FORMAT: json
    depends_on:
      - mongodb

volumes:
  mongodb_data:
